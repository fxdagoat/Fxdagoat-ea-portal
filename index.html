<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d13">
  <title>FXDAGOAT EA Portal</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090d13;color:#f5f7fb;font:16px Arial,sans-serif}
    .top{max-width:760px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #202938}
    .brand{font-weight:900;letter-spacing:2px;font-size:20px}.brand span{color:#36d399}.tag,.eyebrow{color:#36d399;font-size:12px;letter-spacing:2px;font-weight:bold}
    main{max-width:700px;margin:35px auto;padding:0 20px}.hero,.panel{background:#111925;border:1px solid #263346;border-radius:18px;padding:25px;margin-bottom:18px}
    h1{font-size:36px;margin:10px 0}h2{margin-top:0}.muted,.hint,.disclaimer{color:#a9b5c6;line-height:1.55}
    .price{display:flex;align-items:baseline;gap:12px;margin:22px 0}.price strong{font-size:34px}.price span{color:#a9b5c6}
    label{display:block;margin:16px 0 7px;font-size:14px;color:#dce4ef}
    input{width:100%;padding:13px;border-radius:10px;border:1px solid #34445b;background:#0a111b;color:white}
    button{border:0;border-radius:10px;padding:14px 18px;font-weight:bold;cursor:pointer;margin-top:16px}
    .primary{background:#36d399;color:#07130f}.secondary{background:#263346;color:white}
    .payline{display:flex;justify-content:space-between;gap:12px;padding:15px;background:#0a111b;border-radius:10px;margin-top:16px}
    .hint{font-size:13px}.disclaimer{text-align:center;font-size:12px}footer{text-align:center;padding:25px;color:#738197;font-size:12px}
    @media(max-width:480px){h1{font-size:29px}.payline{flex-direction:column}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./app.js"></script>
</body>
</html>
